name: docs-build

on:
  push:
    branches:
      - docs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            container: ubuntu:22.04
            cmake_args: -DOLLAMA_LLAMA_BACKENDS= -DOLLAMA_MLX_BACKENDS=
            target: ollama-local
            artifact: ollama-linux-amd64-cpu
          - name: rocm
            container: rocm/dev-ubuntu-22.04:7.2.1
            cmake_args: -DOLLAMA_LLAMA_BACKENDS=rocm_v7_2 -DOLLAMA_MLX_BACKENDS= -DAMDGPU_TARGETS=gfx1010 -DCMAKE_PREFIX_PATH=/opt/rocm
            target: ollama-llama-server-rocm_v7_2
            artifact: ollama-linux-amd64-rocm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git golang-go zstd

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --target ${{ matrix.target }} --parallel

      - name: Package build output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/${{ matrix.artifact }}
          cmake --install build --prefix "$PWD/dist/${{ matrix.artifact }}"
          tar -C "dist/${{ matrix.artifact }}" -cf - . | zstd -19 -T0 >"${{ matrix.artifact }}.tar.zst"
          cp scripts/install.sh "${{ matrix.artifact }}-install.sh"
          sha256sum "${{ matrix.artifact }}.tar.zst" "${{ matrix.artifact }}-install.sh" >"${{ matrix.artifact }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.zst
            ${{ matrix.artifact }}-install.sh
            ${{ matrix.artifact }}.sha256
          compression-level: 0
          retention-days: 14
